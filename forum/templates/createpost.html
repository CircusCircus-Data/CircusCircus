{% extends 'layout.html' %}
{% block body %}



<div class="postsubmit">
	Enter your post here:<br>
	<div class="postinginfo">
	You are posting to {{ subforum.title }}
	</div>

	<form action="action_post?sub={{ subforum.id }}" method="POST">

		<input class="inputbox" size="100" type="text" placeholder="Title" name="title"><br>

		<textarea class="inputbox" rows="25" cols="100"  name="content" placeholder="Enter post here"></textarea><br>

		<fieldset class="post-visibility">
			<legend>Who can see this post?</legend>
			<label>
				<input type="radio" name="visibility" value="public"
					{% if selected_visibility|default('public') == 'public' %}checked{% endif %}>
				Public — visible to everyone
			</label><br>
			<label>
				<input type="radio" name="visibility" value="private"
					{% if selected_visibility == 'private' %}checked{% endif %}>
				Private — visible only to logged-in users
			</label>
		</fieldset>

		<input class="inputbox" type="submit" value="Submit Post">
	</form>
</div>
{% endblock %}
