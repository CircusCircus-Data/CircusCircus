<div class="signal-bar" aria-label="Sound Lab broadcast status">
	<span><span class="signal-dot" aria-hidden="true"></span> Live community signal</span>
	<span class="signal-code">SL / NYC / 001</span>
</div>

<div class="brand-row">
	<a class="brand-lockup" href="/" aria-label="Sound Lab home">
		<span class="brand-name">Sound Lab</span>
		<span class="brand-studio">Studio</span>
	</a>
	<p class="brand-manifesto">A frequency for musicians talking music, tech, fashion &amp; everything between.</p>
</div>

<nav class="site-nav" aria-label="Main navigation">
	<a href="/">Forum</a>
	{% if current_user.is_authenticated %}
	<a href="/messages/">Messages</a>
	<a href="/settings">Settings</a>
	<span class="nav-identity{% if current_user.admin %} admin{% endif %}">@{{ current_user.username }}</span>
	<a class="nav-action" href="/action_logout">Log out</a>
	{% else %}
	<span class="nav-identity">Guest frequency</span>
	<a class="nav-action" href="/loginform">Log in / Join</a>
	{% endif %}
</nav>
