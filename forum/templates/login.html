{% extends 'layout.html' %}
{% block body %}
<div class="auth-intro">
	<span class="section-kicker">Member access</span>
	<h1>Join the frequency.</h1>
	<p>Log in to continue the conversation, or create a new Sound Lab account.</p>
</div>
<div class="row auth-grid">
	<div class="col-sm-6">
		<section class="loginbox panel panel-default">
			<div class="panel-heading"><h2 class="panel-title">Login to account</h2></div>
			<div class="panel-body">
				<form action="/action_login" method="POST">
					<div class="form-group"><label for="login-username">Username</label><input class="form-control" id="login-username" type="text" name="username" autocomplete="username" required></div>
					<div class="form-group"><label for="login-password">Password</label><input class="form-control" id="login-password" type="password" name="password" autocomplete="current-password" required></div>
					<button class="btn btn-primary btn-lg btn-block" type="submit">Login</button>
				</form>
			</div>
		</section>
	</div>
	<div class="col-sm-6">
		<section class="loginbox panel panel-default">
			<div class="panel-heading"><h2 class="panel-title">Create account</h2></div>
			<div class="panel-body">
				<form action="/action_createaccount" method="POST">
					<div class="form-group"><label for="register-email">Email</label><input class="form-control" id="register-email" type="email" name="email" autocomplete="email" required></div>
					<div class="form-group"><label for="register-username">Username</label><input class="form-control" id="register-username" type="text" name="username" autocomplete="username" required></div>
					<div class="form-group"><label for="register-password">Password</label><input class="form-control" id="register-password" type="password" name="password" autocomplete="new-password" required></div>
					<button class="btn btn-primary btn-lg btn-block" type="submit">Create account</button>
				</form>
			</div>
		</section>
	</div>
</div>
{% endblock %}
