{% extends 'layout.html' %}
{% block body %}

<div class="loginbox panel panel-default">
	<h3>Account Settings</h3>
	{% if success_message %}
	<p class="alert alert-success" role="status">{{ success_message }}</p>
	{% endif %}
	<form action="/action_settings" method="POST">
		<div class="form-group">
		<label for="username">Username</label>
		<input
			class="loginelement form-control"
			id="username"
			name="username"
			type="text"
			value="{{ submitted_username|default(current_user.username) }}"
		>
		</div>

		<div class="form-group">
		<label for="email">Email</label>
		<input
			class="loginelement form-control"
			id="email"
			name="email"
			type="email"
			value="{{ submitted_email|default(current_user.email) }}"
		>
		</div>

		<input class="loginelement btn btn-primary btn-block" type="submit" value="Save Settings">
	</form>
</div>

{% endblock %}
