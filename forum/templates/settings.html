{% extends 'layout.html' %}
{% block body %}

<div class="loginbox">
	<h3>Account Settings</h3>
	<form action="/action_settings" method="POST">
		<label for="username">Username</label><br>
		<input
			class="loginelement"
			id="username"
			name="username"
			type="text"
			value="{{ current_user.username }}"
		><br>

		<label for="email">Email</label><br>
		<input
			class="loginelement"
			id="email"
			name="email"
			type="email"
			value="{{ current_user.email }}"
		><br>

		<input class="loginelement" type="submit" value="Save Settings">
	</form>
</div>

{% endblock %}
