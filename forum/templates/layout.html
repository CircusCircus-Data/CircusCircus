<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Sound Lab is a forum for musicians exploring music, technology, fashion, and culture.">
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='bootstrap.min.css') }}">
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
	<title>{% block title %}{{ config.SITE_NAME|default('Sound Lab') }}{% endblock %}</title>
</head>
<body>
	<a class="skip-link" href="#main-content">Skip to content</a>
	<div class="site-shell editorial-shell">
	<header class="site-header">
		{% include 'header.html' %}
	</header>

	<div class="editorial-frame">
	<aside class="control-sidebar">
		{% include 'sidebar.html' %}
	</aside>
	<div class="page container-fluid">
	{% if errors %}
	<div class="errors alert alert-danger" role="alert">
	{% for error in errors %}
		<p class="error">
			{{ error }}
		</p>

	{% endfor %}
	</div>
{% endif %}
	<main class="content" id="main-content">
		{% block body %}{% endblock %}
	</main>
	</div>
	</div>

	<footer class="site-footer">
		{% include 'footer.html' %}
	</footer>
</div>
</body>
</html>
